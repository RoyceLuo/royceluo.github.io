title: Royce Luo Ph.D.
author: Royce Luo
description: >-
  Personal website — about me, scholarly work, blog, and contact info.
baseurl: "" # served at the domain root now that the repo is royceluo.github.io
url: "https://royceluo.github.io" # the base hostname & protocol, e.g. https://username.github.io

markdown: kramdown
kramdown:
  auto_ids: true # gives every heading a stable #id so the sidebar TOC can link to it

permalink: /blog/:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
