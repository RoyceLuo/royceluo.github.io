<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img" aria-label="Illustration of a superconducting qubit coupled to a phonon mode and a photon mode">
  <rect width="400" height="220" fill="#e3ecdf"/>

  <!-- coupling lines -->
  <line x1="120" y1="102" x2="168" y2="92" stroke="#69594e" stroke-width="2" stroke-dasharray="6,5"/>
  <line x1="234" y1="100" x2="292" y2="105" stroke="#69594e" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="138" y="88" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#69594e">g&#8321;</text>
  <text x="256" y="90" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#69594e">g&#8322;</text>

  <!-- superconducting qubit -->
  <circle cx="88" cy="112" r="34" fill="#fbf7ec" stroke="#3d2b1f" stroke-width="3"/>
  <line x1="70" y1="94" x2="106" y2="130" stroke="#4e6e58" stroke-width="3"/>
  <line x1="106" y1="94" x2="70" y2="130" stroke="#4e6e58" stroke-width="3"/>
  <text x="55" y="168" font-family="'Segoe UI', sans-serif" font-size="13" fill="#3d2b1f">Qubit</text>

  <!-- phonon resonator -->
  <rect x="168" y="72" width="64" height="80" rx="12" fill="#fbf7ec" stroke="#3d2b1f" stroke-width="3"/>
  <path d="M174,112 Q188,84 200,112 T226,112" fill="none" stroke="#c89090" stroke-width="3"/>
  <text x="170" y="168" font-family="'Segoe UI', sans-serif" font-size="13" fill="#3d2b1f">Phonon</text>

  <!-- photon mode -->
  <circle cx="322" cy="112" r="14" fill="none" stroke="#4e6e58" stroke-width="2"/>
  <circle cx="322" cy="112" r="26" fill="none" stroke="#4e6e58" stroke-width="2" opacity="0.7"/>
  <circle cx="322" cy="112" r="38" fill="none" stroke="#4e6e58" stroke-width="2" opacity="0.4"/>
  <text x="298" y="168" font-family="'Segoe UI', sans-serif" font-size="13" fill="#3d2b1f">Photon</text>
</svg>
